<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080809" />
  <title>Dayani Meeting</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <section id="joinScreen" class="join-screen">
      <div class="join-card">
        <div class="brand-row">
          <div class="brand-mark">D</div>
          <div>
            <strong>DAYANI GROUP</strong>
            <span>Private Video Meeting</span>
          </div>
        </div>

        <div class="join-copy">
          <h1>Private video meeting.</h1>
          <p>One link. Mac or mobile. No app installation.</p>
        </div>

        <form id="joinForm" class="join-form">
          <label>
            Your name
            <input id="displayName" autocomplete="name" placeholder="Mohammad" required />
          </label>
          <label>
            Meeting code
            <div class="room-row">
              <input id="roomCode" autocomplete="off" spellcheck="false" required />
              <button id="newRoom" class="ghost-button" type="button">New</button>
            </div>
          </label>
          <button id="enterButton" class="primary-button" type="submit">Start meeting</button>
          <button id="copyInvite" class="text-button" type="button">Copy guest link</button>
        </form>
        <p id="joinHint" class="hint" aria-live="polite"></p>
      </div>
    </section>

    <section id="meetingScreen" class="meeting-screen" hidden>
      <header class="topbar">
        <div class="brand-row compact">
          <div class="brand-mark">D</div>
          <strong>DAYANI GROUP</strong>
        </div>
        <div class="meeting-meta">
          <span id="connectionState" class="state-pill">Connecting</span>
          <span id="elapsed">00:00</span>
          <button id="copyInviteTop" class="icon-button" type="button" aria-label="Copy guest link">↗</button>
        </div>
      </header>

      <section class="call-stage">
        <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
        <div id="remoteEmpty" class="remote-empty">
          <strong id="remoteStatusTitle">Waiting for guest</strong>
          <span id="remoteStatusText">Share the meeting link to begin.</span>
        </div>

        <div id="subtitle" class="subtitle" hidden></div>

        <div class="self-view">
          <video id="localVideo" autoplay playsinline muted></video>
          <span>You</span>
        </div>

        <div id="approvalCard" class="approval-card" hidden>
          <span>Join request</span>
          <strong id="guestName">Guest</strong>
          <div>
            <button id="approveGuest" class="primary-button small" type="button">Allow</button>
            <button id="denyGuest" class="ghost-button small" type="button">Deny</button>
          </div>
        </div>

        <div class="call-controls">
          <button id="micButton" class="control-button active" type="button">Mic</button>
          <button id="cameraButton" class="control-button active" type="button">Camera</button>
          <button id="endCall" class="control-button danger" type="button">End</button>
        </div>
      </section>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
