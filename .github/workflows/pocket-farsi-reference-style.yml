name: Pocket TTS Farsi Reference Style

on:
  push:
    branches:
      - test/edge-tts-dilara
    paths:
      - tools/pocket_farsi_reference_style.py
      - .github/workflows/pocket-farsi-reference-style.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "pocket-tts @ git+https://github.com/mallahyari/pocket-tts@main"
          pip install transformers sentencepiece scipy huggingface_hub soundfile
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate
        run: python tools/pocket_farsi_reference_style.py

      - name: ASR check
        run: |
          python - <<'PY'
          from transformers import pipeline
          pipe = pipeline(
              "automatic-speech-recognition",
              model="openai/whisper-base",
              device=-1,
              generate_kwargs={"language":"fa","task":"transcribe"}
          )
          fn="pocket-reference-output/pocket-farsi-reference-style.wav"
          r=pipe(fn)
          print(r["text"])
          open("pocket-reference-output/asr.txt","w",encoding="utf-8").write(r["text"])
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-farsi-reference-style
          path: pocket-reference-output/*
          retention-days: 3
          if-no-files-found: error
