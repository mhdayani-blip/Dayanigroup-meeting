name: Probe ElevenLabs Public Voice Library

on:
  workflow_dispatch:
  push:
    branches:
      - test/edge-tts-dilara
    paths:
      - .github/workflows/probe-elevenlabs-voices.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query public shared voices
        run: |
          mkdir -p probe
          curl -L --fail --silent --show-error             'https://api.elevenlabs.io/v1/shared-voices?search=Niyayesh&page_size=100'             -o probe/search-niyayesh.json || true
          curl -L --fail --silent --show-error             'https://api.elevenlabs.io/v1/shared-voices?search=%D9%86%DB%8C%D8%A7%DB%8C%D8%B4&page_size=100'             -o probe/search-niyayesh-fa.json || true
          curl -L --fail --silent --show-error             'https://api.elevenlabs.io/v1/shared-voices?language=fa&gender=female&page_size=100'             -o probe/fa-female.json || true
          curl -L --fail --silent --show-error             'https://api.elevenlabs.io/v1/shared-voices?language=fa&page_size=100'             -o probe/fa-all.json || true
          ls -lah probe
          for f in probe/*.json; do echo "=== $f ==="; head -c 2000 "$f"; echo; done

      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: elevenlabs-public-voice-probe
          path: probe/*.json
          retention-days: 2
